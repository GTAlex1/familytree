<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Árbol genealógico</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div id="cf"><input id="ci" maxlength="5" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="cb">→</button></div><h1>🌳<span class="t"> Árbol genealógico</span></h1><select id="ts" style="display:none"></select><button id="lb">Login</button></header>
<div id="tools"><span id="cc"></span><button onclick="copyCode()">Copiar código</button><button onclick="regenCode()">Nuevo código</button>
<button class="p" onclick="edit()">+ Añadir persona</button>
<button onclick="newTree()">+ Nuevo árbol</button>
<button onclick="expo()">Exportar</button>
<button onclick="document.getElementById('imp').click()">Importar</button>
<button class="d" onclick="reset()">Datos iniciales</button>
<input type="file" id="imp" accept=".json" hidden></div>
<div id="wrap"><div id="tree"></div></div>
<div id="sheet"></div>
<div id="modal"><div class="b" id="mb"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
